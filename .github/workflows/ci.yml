name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
      - name: Install execution validation tools
        run: |
          mkdir -p target
          curl --fail --location https://c9x.me/compile/release/qbe-1.2.tar.xz -o target/qbe-1.2.tar.xz
          echo 'a6d50eb952525a234bf76ba151861f73b7a382ac952d985f2b9af1df5368225d  target/qbe-1.2.tar.xz' | sha256sum --check
          tar -xf target/qbe-1.2.tar.xz -C target
          make -C target/qbe-1.2
          npm install --prefix target/wasm-tools --no-audit --no-fund wabt@1.0.39
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: |
          # 意図したtrapをOSのクラッシュ収集へ送らず、終了状態と診断を検証します。
          # pipe型のcore_patternではulimitだけでは収集を止められません。
          sysctl kernel.core_pattern
          sudo sysctl -w kernel.core_pattern=core
          ulimit -c 0
          timeout --kill-after=10s 8m bash -o pipefail -c 'cargo test --all-targets 2>&1 | tee target/ci-tests.log'
        env:
          PRIMER_TEST_TRACE: "1"
          PRIMER_TEST_CC: clang
          PRIMER_TEST_LLVM_CLANG: clang
          PRIMER_TEST_QBE: ${{ github.workspace }}/target/qbe-1.2/qbe
          PRIMER_TEST_NODE: node
          PRIMER_TEST_OBJDUMP: objdump
          PRIMER_TEST_WAT2WASM_JS: ${{ github.workspace }}/target/wasm-tools/node_modules/wabt/bin/wat2wasm
      - name: Preserve test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-log
          path: target/ci-tests.log
          if-no-files-found: ignore
      - name: C string and u64 sanitizer checks
        run: |
          ulimit -c 0
          cargo test --test c_strings
        env:
          PRIMER_TEST_CC: clang
          PRIMER_TEST_SANITIZE: "1"

  windows-strings:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
      - name: Install WAT validation tool
        run: npm install --prefix target/wasm-tools --no-audit --no-fund wabt@1.0.39
      - name: Compare strings, u64, assembly, and machine artifacts on Windows
        run: cargo test --test llvm_strings --test c_strings --test string_routes --test native_assembly --test runtime_routes --test source_files
        env:
          PRIMER_TEST_CC: clang
          PRIMER_TEST_LLVM_CLANG: clang
          PRIMER_TEST_ASM_CLANG: clang
          PRIMER_TEST_OBJDUMP: llvm-objdump
          PRIMER_TEST_NODE: node
          PRIMER_TEST_WAT2WASM_JS: ${{ github.workspace }}/target/wasm-tools/node_modules/wabt/bin/wat2wasm
