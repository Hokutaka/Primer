name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
        env:
          PRIMER_TEST_CC: clang
          PRIMER_TEST_LLVM_CLANG: clang
      - name: C string memory checks
        run: cargo test --test c_strings
        env:
          PRIMER_TEST_CC: clang
          PRIMER_TEST_SANITIZE: "1"

  windows-strings:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Compare string output on Windows
        run: cargo test --test llvm_strings --test c_strings
        env:
          PRIMER_TEST_CC: clang
          PRIMER_TEST_LLVM_CLANG: clang
